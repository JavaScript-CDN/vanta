[package]
name = "vanta"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vanta — local multi-profile browser manager"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
core-model.workspace = true
core-vault.workspace = true
core-db.workspace = true
core-fp.workspace = true
core-proxy.workspace = true
core-launch.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
getrandom.workspace = true
zeroize.workspace = true
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
