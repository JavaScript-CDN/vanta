name: Vanta engine stage
description: Restore the build tree, run one time-boxed build stage, save the tree.
inputs:
  prepare-only: { required: false, default: "false" }
  final: { required: false, default: "false" }
outputs:
  status:
    description: "'running' if more stages are needed, 'completed' when chrome is linked"
    value: ${{ steps.build.outputs.status }}
runs:
  using: composite
  steps:
    - name: Free disk and add swap
      shell: bash
      run: bash ./.github/scripts/free-disk.sh
    - name: Download builder image
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with: { name: vanta-builder-image, path: /tmp/img }
    - name: Load builder image
      shell: bash
      run: docker load -i /tmp/img/vanta-builder.tar && rm -rf /tmp/img
    - name: Download build tree
      if: ${{ inputs.prepare-only != 'true' }}
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with: { name: vanta-build-tree, path: .github/cache/ }
    - name: Import build tree
      if: ${{ inputs.prepare-only != 'true' }}
      shell: bash
      run: bash ./.github/scripts/import-cache.sh
    - name: Build
      id: build
      shell: bash
      env:
        _prepare_only: ${{ inputs.prepare-only }}
        _gha_final: ${{ inputs.final }}
      run: bash ./.github/scripts/docker-run.sh
    - name: Export build tree
      if: ${{ steps.build.outputs.status != 'completed' || inputs.prepare-only == 'true' }}
      shell: bash
      run: bash ./.github/scripts/export-cache.sh
    - name: Package engine
      if: ${{ steps.build.outputs.status == 'completed' }}
      shell: bash
      run: bash ./.github/scripts/package.sh
    - name: Upload build tree
      if: ${{ steps.build.outputs.status != 'completed' || inputs.prepare-only == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: vanta-build-tree
        path: .github/cache/build-tree.tar.zst
        if-no-files-found: error
        overwrite: true
        retention-days: 2
        compression-level: 0
    - name: Upload engine
      if: ${{ steps.build.outputs.status == 'completed' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: vanta-engine-linux-x64
        path: dist/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
