name: Vanta engine (Chromium) - Windows x64

on:
  workflow_dispatch:
  push:
    tags: ['engine-v*']

permissions:
  contents: read

concurrency:
  group: vanta-engine-win
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  prep:
    name: Prepare source, deps, gn
    runs-on: windows-2025-vs2026
    timeout-minutes: 355
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/win-env
      - name: Fetch Chromium + Windows deps, patch, gn gen
        run: |
          python scripts/win_build.py prepare
          if ($LASTEXITCODE -ne 0) { throw "prepare failed" }
      - name: Mark
        id: build
        run: '"status=running" >> $env:GITHUB_OUTPUT'
      - name: Save build tree
        if: steps.build.outputs.status == 'running'
        run: |
          7z a -tzip D:\tree.zip D:\v\src D:\v\depot_tools D:\v\.gclient -mx=3 -mtc=on -mmt=on -bso0 -bsp0
          if ($LASTEXITCODE -gt 1) { throw "7z failed: $LASTEXITCODE" }  # 1 = warnings (dangling links), tolerated
          $global:LASTEXITCODE = 0
          Get-Item D:\tree.zip | Select-Object Name, @{n='GB';e={[math]::Round($_.Length/1GB,2)}}
      - name: Upload build tree
        if: steps.build.outputs.status == 'running'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: vanta-win-tree, path: 'D:\tree.zip', archive: false, overwrite: true, retention-days: 3, if-no-files-found: error }

  build_01:
    name: Compile stage 1
    needs: prep
    if: needs.prep.outputs.status == 'running'
    runs-on: windows-2025-vs2026
    timeout-minutes: 355
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/win-env
      - name: Download build tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: vanta-win-tree, path: 'D:\dl' }
      - name: Restore build tree
        run: |
          $z = Get-ChildItem D:\dl -File | Select-Object -First 1
          7z x $z.FullName -oD:\v -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw "7z extract failed" }
          Remove-Item D:\dl -Recurse -Force
      - name: Compile (time-boxed)
        id: build
        run: |
          python scripts/win_build.py stage --timeout 14400 --jobs 3
          $rc = $LASTEXITCODE
          if ($rc -eq 0) { "status=completed" >> $env:GITHUB_OUTPUT }
          elseif ($rc -eq 124) { "status=running" >> $env:GITHUB_OUTPUT }
          else { throw "build failed with exit code $rc" }
          exit 0
      - name: Package engine
        if: steps.build.outputs.status == 'completed'
        run: python scripts/win_build.py package
      - name: Upload engine
        if: steps.build.outputs.status == 'completed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: vanta-engine-win-x64, path: dist/*, retention-days: 30, if-no-files-found: error, compression-level: 0 }
      - name: Save build tree
        if: steps.build.outputs.status == 'running'
        run: |
          7z a -tzip D:\tree.zip D:\v\src D:\v\depot_tools D:\v\.gclient -mx=3 -mtc=on -mmt=on -bso0 -bsp0
          if ($LASTEXITCODE -gt 1) { throw "7z failed: $LASTEXITCODE" }  # 1 = warnings (dangling links), tolerated
