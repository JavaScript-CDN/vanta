name: app-windows

# Builds and tests the Vanta manager (Tauri 2 + Rust core + React UI) on Windows and produces
# the NSIS installer. The engine (Chromium) is built separately by engine-windows.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-windows.yml']
  pull_request:
    paths: ['app/**']

permissions:
  contents: read

concurrency:
  group: app-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: UI install, typecheck, build
        working-directory: app/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Rust tests (core crates)
        run: cargo test --workspace --locked

      - name: Clippy (deny correctness + suspicious lints)
        run: cargo clippy --workspace --locked --all-targets -- -D clippy::correctness -D clippy::suspicious

      - name: Release gate - no remote debugging / automation switches in the launcher
        run: |
          # The deny-list constant (FORBIDDEN) is the only place these strings may appear.
          $hits = Get-ChildItem -Recurse -Include *.rs crates, src-tauri/src |
            Select-String -Pattern '--remote-debugging','--enable-automation','--remote-allow-origins' -SimpleMatch |
            Where-Object { $_.Line -notmatch 'FORBIDDEN' -and $_.Line -notmatch '^\s*//' }
          if ($hits) { $hits; throw "forbidden switch found" }
          cargo test -p core-launch --locked no_debug_switches

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.12" --locked

      - name: Build installer (NSIS)
        working-directory: app/src-tauri
        run: cargo tauri build --bundles nsis

      - name: Collect installer + checksum
        run: |
          $out = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/vanta-app"
          $exe = Get-ChildItem -Recurse target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "installer not produced" }
          Copy-Item $exe.FullName $out
          Copy-Item target/release/vanta.exe "$out/vanta-portable.exe"
          Get-ChildItem $out -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content "$out/SHA256SUMS.txt"
          Get-Content "$out/SHA256SUMS.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vanta-app-win-x64
          path: ${{ runner.temp }}/vanta-app
          retention-days: 30
          if-no-files-found: error
