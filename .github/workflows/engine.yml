name: Vanta engine (Chromium) - Linux x64

on:
  workflow_dispatch:
  push:
    tags: ['engine-v*']

permissions:
  contents: read

concurrency:
  group: vanta-engine
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prep:
    name: Prepare source, toolchain, gn
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build builder image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./docker
          file: ./docker/build.Dockerfile
          tags: vanta-builder:local
          outputs: type=docker,dest=/tmp/vanta-builder.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: vanta-builder-image, path: /tmp/vanta-builder.tar, retention-days: 2 }
      - run: rm -f /tmp/vanta-builder.tar
      - uses: ./.github/actions/build
        with: { prepare-only: "true" }

  build_01:
    name: Compile stage 1
    needs: prep
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/build
        id: build
        with: { final: "false" }

  build_02:
    name: Compile stage 2
    needs: build_01
    if: needs.build_01.outputs.status == 'running'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/build
        id: build
        with: { final: "false" }

  build_03:
    name: Compile stage 3
    needs: build_02
    if: needs.build_02.outputs.status == 'running'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/build
        id: build
        with: { final: "false" }

  build_04:
